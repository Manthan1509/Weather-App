<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="Enter City Name" spellcheck="false">
            <button><img src="imgs/images/search.png"></button>
        </div>

        <div class="weather">
            <img src="imgs/images/rain.png" class="weather-icon">
            <h1 class="temp">22°C</h1>
            <h2 class="city">New York</h2>

            <div class="details">
                <div class="col">
                    <img src="imgs/images/humidity.png">
                    <div>
                        <p class="humidity">50%</p>
                        <p>Humididty</p>
                    </div>
                </div>

                <div class="col">
                    <img src="imgs/images/wind.png">
                    <div>
                        <p class="wind">15 km/h</p>
                        <p>Wind Speed</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const apiKey = "5ccd6343ab445afd0777dfebc6347407";
        const apiUrl = "https://api.openweathermap.org/data/2.5/weather?units=metric&q=delhi";

        async function checkWeather(){
            const response = await fetch(apiUrl + `&appid=${apiKey}`);
            var data = response.json();
            console.log(data);
        }
        checkWeather();
    </script>
</body>
</html>
